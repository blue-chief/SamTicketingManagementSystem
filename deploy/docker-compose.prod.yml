# Production overrides – extends the base compose.
# Usage: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d

services:
  api:
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0 --port 8000 --workers 4
    volumes: []  # no bind mount in prod

  worker:
    volumes: []  # no bind mount in prod

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  caddy_data:
  caddy_config:
